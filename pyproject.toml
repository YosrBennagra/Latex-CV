[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latex-cv"
version = "2.0.0"
description = "LaTeX CV system with AI-powered optimization agent"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yosr Ben Nagra", email = "yosrbennagra@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "cv", "resume", "latex", "ats", 
    "optimization", "job-search", "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = []

[project.optional-dependencies]
agent = [
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/YosrBennagra/latex-cv"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["cv-agent/tests"]
pythonpath = ["cv-agent"]
